          <section class="rail-card milestone-rail-card">
            <div class="milestone-card-inner sf-card">
              <div class="milestone-badge-box">
                <i class="fa-solid fa-award text-primary"></i>
              </div>
              <div class="milestone-content">
                <h4>Next Certificate in Reach</h4>
                <p>You are only <strong>2 lessons away</strong> from unlocking your <em>Advanced CSS Specialist</em> certificate.</p>
                <a href="study.html" class="sf-btn sf-btn-primary">Finish Lessons</a>
              </div>
            </div>
          </section>

          <!-- ══════════════════ 9. CERTIFICATE SECTION ══════════════════ -->
          <section class="rail-card certificate-rail-card">
            <div class="rail-card-header">
              <div class="header-icon-title">
                <i class="fa-solid fa-certificate text-primary"></i>
                <h3>Certificates</h3>
              </div>
              <a href="learning.html#certificates" class="sf-link-xs">View all</a>
            </div>

            <div class="certificate-card sf-card">
              <div class="certificate-card-icon">
                <i class="fa-solid fa-award"></i>
              </div>
              <div class="certificate-card-content">
                <span class="certificate-tag">READY TO CLAIM</span>
                <h4>Advanced CSS Specialist</h4>
                <p>Complete 2 more lessons to unlock and download your certificate.</p>
                <a href="learning.html#certificates" class="sf-btn sf-btn-primary">Open Certificates</a>
              </div>
            </div>
